## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: ">=5.0"
  ## Import needed components only
  espressif/esp_h264:
    version: "~1.3"
    rules:
    - if: target in [esp32p4, esp32s3]
  espressif/esp_peer:
    version: "*"
    override_path: ../../../components/esp_peer
  kvs_signaling:
    path: ../../../components/esp_webrtc/impl/kvs_signaling
    version: "*"
  espressif/esp_board_manager:
    version: "~0.7"
  tempotian/av_render:
    version: "*"
    override_path: ../../../components/av_render
  tempotian/media_lib_utils:
    version: "*"
    override_path: ../../../components/media_lib_utils
  esp_webrtc:
    path: ../../../components/esp_webrtc
    version: "*"
  webrtc_utils:
    version: "*"
    path: ../../../components/webrtc_utils
